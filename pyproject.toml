[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "batrade"
version = "0.1.0"
description = "Batrade Home-SOC: monitor local de red doméstica (IDS, solo detección)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "Flask>=3.0",
    "defusedxml>=0.7",
    "scapy>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]
# Extra opcional para el motor de flujos (Isolation Forest). Sin él, el scoring
# usa DummyScorer y el motor no emite nada.
ml = ["numpy>=1.26"]

[project.scripts]
batrade = "batrade.cli:main"

[tool.setuptools.packages.find]
include = ["batrade*"]

[tool.setuptools.package-data]
batrade = [
    "dashboard/templates/*.html",
    "dashboard/static/*.css",
    "dashboard/static/*.js",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.batrade]
db = "var/batrade.db"
