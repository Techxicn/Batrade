name: tests

# La suite es offline y sin privilegios: no necesita nmap, arp-scan ni red.
on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  lint:
    name: ruff (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar ruff
        run: python -m pip install --upgrade pip ruff

      - name: Ejecutar ruff check
        run: ruff check batrade tests scripts

  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependencias del proyecto
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ejecutar la suite
        run: python -m pytest -p no:cacheprovider
